<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meteoritos Universidad de Chile — National Meteorite Repository, Department of Geology</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/supabase.js"></script>
<script src="js/utif.js"></script>
<script src="js/pako.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/ir-data.js"></script>
<script src="js/i18n.js"></script>
</head>
<body>

<nav>
  <span class="brand">Meteoritos Universidad de Chile</span>
  <a href="#" data-page="home" class="active" onclick="navigate('home')">Home</a>
  <a href="#" data-page="samples" onclick="navigate('samples')">Samples</a>
  <a href="#" data-page="pairing" onclick="navigate('pairing')">Pairing</a>
  <a href="#" data-page="research" onclick="navigate('research')">Research</a>
  <a href="#" data-page="contact" onclick="navigate('contact')">Contact</a>
  <span style="flex:1"></span>
  <a href="#" id="locale-toggle" onclick="toggleLocale();return false" style="font-size:13px;font-weight:700;color:#ffd700;margin-left:10px;border:1px solid #ffd700;border-radius:3px;padding:2px 8px">ES</a>
</nav>

<!-- HOME -->
<div class="page active" id="page-home"><div id="home-content"></div></div>

<!-- SAMPLES -->
<div class="page" id="page-samples"><div id="samples-content"></div></div>

<!-- SAMPLE DETAIL -->
<div class="page" id="page-sample"><div id="sample-content"></div></div>

<!-- PAIRING -->
<div class="page" id="page-pairing"><div id="pairing-content"></div></div>

<!-- RESEARCH -->
<div class="page" id="page-research"><div id="research-content"></div></div>

<!-- CONTACT -->
<div class="page" id="page-contact"><div id="contact-content"></div></div>

<div id="toast"></div>

<div id="lightbox" class="lightbox" onclick="if(event.target===this)closeLightbox()">
  <span class="lb-close" onclick="closeLightbox()">&times;</span>
  <span class="lb-nav lb-prev" onclick="lbPrev()">&lsaquo;</span>
  <span class="lb-nav lb-next" onclick="lbNext()">&rsaquo;</span>
  <div class="lb-img-wrap" id="lb-img-wrap"></div>
  <div class="lb-counter" id="lb-counter"></div>
</div>

<div id="fig-overlay" class="fig-overlay" onclick="if(event.target===this)closeFigOverlay()">
  <span class="fig-close" onclick="closeFigOverlay()">&times;</span>
  <div class="fig-overlay-wrap" id="fig-overlay-wrap"></div>
  <div class="fig-label" id="fig-overlay-label"></div>
</div>

<script src="js/app.js"></script>
<script>navigate('home');</script>
<footer style="text-align:center;padding:20px 10px;font-size:13px;color:#999;border-top:1px solid #eee;margin-top:30px">

</footer>

</html>
